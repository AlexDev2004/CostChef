<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="images/png" href="images/logo noir.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/var.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/produits.css">
    <!-- <link rel="stylesheet" href="../css/mediaQueryPc2.css" media="only screen and (max-width:1430px)">
     <link rel="stylesheet" href="../css/mediaQueryTablet.css" media="only screen and (max-width:1230px)">
    <link rel="stylesheet" href="../css/mediaQueryTabletMini.css" media="only screen and (max-width:900px)">
    <link rel="stylesheet" href="../css/mediaQuerymobile.css" media="only screen and (max-width:820px)">
    <link rel="stylesheet" href="../css/mediaQuerymobileMini.css" media="only screen and (max-width:420px)"> -->
    <title>CostChef</title>
</head>

<body>
    <header>
        <a class="logoCostChef" href="../index.html"><img class="logoCostChef" src="../images/logo blanc 2.png" alt="Logo CostChef"></a>
        <img class="logoResto" src="../images/fast-food-restaurant-logo,-restaurant-logo-design-template-33255790cb8e1186b28609dd9afd4ee6_screen.jpg" alt="Logo restaurant">
        <h2>Le restaurant</h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-icon lucide-lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <!-- <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-open-icon lucide-lock-open"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> -->
    </header>
    <main>
        <div id="produitsTitle">
            <div><svg xmlns="http://www.w3.org/2000/svg" width="85" height="85" viewBox="0 0 24 24" fill="none" stroke="var(--cSecond)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package-icon lucide-package"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg></div>                 
            <div>
                <h2>Produits</h2>
                <p>Gérez votre catalogue de produits, catégories et prix d’achat.</p>
            </div>
        </div>

        <!-- --------------------Section supérieure avec recherche de produits + bouton Ajouter un produit------------------- -->
        <section>
            <div id="search">
                <h3>Liste des produits</h3>
                <form id="searchForm">
                    <input name="searchInputProduct" id="searchInputProduct" type="text" placeholder="Recherchez un produit">
                    <select name="filterProductTypeSearch" id="filterProductTypeSearch">
                        <option value="alphabetique">Alphabétique</option>
                        <option value="catégorie">Catégorie</option>
                        <option value="prix">Prix</option>
                        <option value="unite">Unités</option>
                    </select>
                </form>
            </div>
            <button class="primaryButton" id="boutonAjoutProduit">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--cBackground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <h3>Créer une recette</h3>
            </button>
        </section>

        <!-- ----------------------------------------------------Overlay ------------------------------------------------------>

        <article>
            <form post="#" id="créationDeProduit">
                <div><div id="nomProduit"><label for="nomProduitText">Nom du produit</label><input type="text" name="nomProduit" id="nomProduitText" placeholder="Ex. Carotte, Huile d'olive..."></div></div>
                <div><div><label for="categorie">Catégorie</label><select name="categorie" id="categorie"><option value="dov">DOV</option><option value="doa">DOA</option><option value="bof">BOF</option><option value="economat">Economat</option><option value="cave">Cave</option><option value="surgele">Surgelé</option><option value="materiel">Matériel</option></select></div>
                <div><label for="unite">Unité</label><select name="unite" id="unite"><option value="kg">kg</option><option value="L">L</option><option value="piece">Pièce</option><option value="botte">Botte</option><option value="boite">Boîte</option></select></div></div>
                <div><div><label for="prixU">Prix unitaire</label><input type="number" id="prixU" name="prixU"></div>
                <button type="submit">Confirmer</button></div>
            </form>
        </article>

        <!-- ----------------------------------------------Tableau de produits---------------------------------------------- -->

        <div id="tableContainer"><table>
            <tr> <!-- Ligne de titres des éléments du tableau -->
                <th>Ingrédients</th>
                <th>Catégorie</th>
                <th>Unité</th>
                <th>Prix unitaire (€)</th>
                <th></th>
            </tr>

        </table></div>



    </main>
    <footer>
        <div id="ariane"><button onclick="window.history.back()" class="secondaryButton">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--cButton)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left-icon lucide-arrow-left"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                <h3>Retour</h3>
            </button>
            <div><a href="../index.html">Accueil</a></div> <div class="arianeSeparator">></div>
            <div><a class="buttonOff" href="#">Produits</a></div>
        </div>
        <div id="cgu"><a href="#">Mention légales</a></div>
    </footer>
    <script src="../js/products.js"></script>
</body>
</html>
